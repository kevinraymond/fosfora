      .edge-label.orange { fill: #ff6040; font-style: normal; font-weight: 600; letter-spacing: 0.04em; font-size: 10.5px; }
      .note { font-size: 10.5px; fill: #9198a1; }
    </style><text x="450" y="32" class="eyebrow" style="text-anchor: middle">TRAINED ON THE RAW EVIDENCE THE DETECTORS READ, NOT THE PUBLISHED BUS</text><rect x="25" y="97" width="150" height="46" rx="23" class="io"/><text x="100" y="117" class="title">Corpus</text><text x="100" y="133" class="sub">CC BY · ANNOTATED</text><rect x="205" y="97" width="150" height="46" rx="2" class="node"/><text x="280" y="117" class="title">Hop dumps</text><text x="280" y="133" class="sub">FOSFORA_HOP_SIDECAR</text><rect x="385" y="97" width="150" height="46" rx="2" class="node"/><text x="460" y="117" class="title">Labels</text><text x="460" y="133" class="sub">BEATS AT THE LAG</text><rect x="565" y="97" width="150" height="46" rx="2" class="node"/><text x="640" y="117" class="title">Dataset</text><text x="640" y="133" class="sub">build_dataset.py</text><rect x="745" y="97" width="150" height="46" rx="2" class="node"/><text x="820" y="117" class="title">Train</text><text x="820" y="133" class="sub">TREES · train.py</text><path d="M177 120 H203" class="edge" marker-end="url(#arrow)"/><path d="M357 120 H383" class="edge" marker-end="url(#arrow)"/><path d="M537 120 H563" class="edge" marker-end="url(#arrow)"/><path d="M717 120 H743" class="edge" marker-end="url(#arrow)"/><rect x="745" y="207" width="150" height="46" rx="2" class="node"/><text x="820" y="227" class="title">Export</text><text x="820" y="243" class="sub">beat_model.json</text><rect x="565" y="207" width="150" height="46" rx="2" class="node"/><text x="640" y="227" class="title">Golden test</text><text x="640" y="243" class="sub">WITHIN AN ULP · CI</text><rect x="385" y="207" width="150" height="46" rx="2" class="node"/><text x="460" y="227" class="title">Runtime</text><text x="460" y="243" class="sub">beat_model.rs</text><rect x="205" y="207" width="150" height="46" rx="23" class="io"/><text x="280" y="227" class="title">Activation</text><text x="280" y="243" class="sub">PEAKS · ACF LEVEL</text><path d="M743 230 H717" class="edge" marker-end="url(#arrow)"/><path d="M563 230 H537" class="edge" marker-end="url(#arrow)"/><path d="M383 230 H357" class="edge" marker-end="url(#arrow)"/><path d="M820 143 V205" class="edge" marker-end="url(#arrow)"/><rect x="25" y="207" width="150" height="46" rx="23" class="io" stroke-dasharray="4 3"/><text x="100" y="227" class="title">Negatives</text><text x="100" y="243" class="sub">155 BEATLESS CLIPS</text><path d="M100 207 V160 H190 V130" class="edge" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="450" y="300" class="note" style="text-anchor: middle">a better activation needs its readers re-tuned with it: the arbiter threshold, the level choice</text><text x="450" y="320" class="note" style="text-anchor: middle">the kick model follows the same shape: scripts/kick_model → kick_model.json → kick_model.rs</text></svg>
