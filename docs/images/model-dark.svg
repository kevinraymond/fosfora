<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Training the beat activation: a CC BY corpus with annotated beats is dumped per hop through the hop sidecar, labeled at the target lag, built into a dataset and trained as a tree ensemble; the export is golden-tested in CI and evaluated by the runtime every hop, whose peaks feed the arbiter and whose autocorrelation chooses the level; beatless clips guard it."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5090e0"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff6040"/></marker></defs><style>
      text { font-family: ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; text-anchor: middle; }
      .title { font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .sub { font-size: 9.5px; letter-spacing: 0.06em; fill: #9198a1; }
      .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: 0.18em; fill: #9198a1; }
      .node { fill: #0d1117; stroke: #6e7681; stroke-width: 1.3; }
      .io { fill: #4a2317; stroke: #ff6040; stroke-width: 1.6; }
      .gate { fill: #14305c; stroke: #5090e0; stroke-width: 1.6; }
      .retry { fill: #1a2740; stroke: #5090e0; stroke-width: 1.3; }
      .band { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .group { fill: none; stroke: #484f58; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .cam { fill: #0d1117; stroke: #8b949e; stroke-width: 1.1; }
      .edge { fill: none; stroke: #8b949e; stroke-width: 1.5; stroke-linejoin: round; }
      .edge.blue { stroke: #5090e0; marker-end: url(#arrow-blue); }
      .edge.orange { stroke: #ff6040; marker-end: url(#arrow-orange); }
      .edge-label { font-size: 11px; font-style: italic; fill: #9198a1; }
