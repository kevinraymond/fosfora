<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Offline modes: a file is decoded and driven through the same hop chain faster than realtime; --analyze reports tempo, key and sections, --signal-dump writes what --signal would send for the bench and the TouchDesigner comparison, --render-scene renders frames without a window, all behind the analyze feature; --render-loop ships in every download."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7781"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5090e0"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff6040"/></marker></defs><style>
      text { font-family: ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; text-anchor: middle; }
      .title { font-size: 13px; font-weight: 600; fill: #1f2328; }
      .sub { font-size: 9.5px; letter-spacing: 0.06em; fill: #59636e; }
      .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: 0.18em; fill: #59636e; }
      .node { fill: #ffffff; stroke: #8c959f; stroke-width: 1.3; }
      .io { fill: #ffece6; stroke: #ff6040; stroke-width: 1.6; }
      .gate { fill: #e3edfa; stroke: #3a70c0; stroke-width: 1.6; }
      .retry { fill: #eef4fc; stroke: #5090e0; stroke-width: 1.3; }
      .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .group { fill: none; stroke: #b6bec7; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .cam { fill: #ffffff; stroke: #6e7781; stroke-width: 1.1; }
      .edge { fill: none; stroke: #6e7781; stroke-width: 1.5; stroke-linejoin: round; }
      .edge.blue { stroke: #5090e0; marker-end: url(#arrow-blue); }
      .edge.orange { stroke: #ff6040; marker-end: url(#arrow-orange); }
      .edge-label { font-size: 11px; font-style: italic; fill: #59636e; }
      .edge-label.blue { fill: #5090e0; font-style: normal; font-weight: 600; letter-spacing: 0.04em; font-size: 10.5px; }
      .edge-label.orange { fill: #ff6040; font-style: normal; font-weight: 600; letter-spacing: 0.04em; font-size: 10.5px; }
      .note { font-size: 10.5px; fill: #59636e; }
    </style><text x="450" y="32" class="eyebrow" style="text-anchor: middle">THE SAME CODE AS LIVE, DRIVEN BY A FILE, FASTER THAN REALTIME</text><rect x="30" y="177" width="120" height="46" rx="23" class="io"/><text x="90" y="197" class="title">File</text><text x="90" y="213" class="sub">WAV · MP3 · FLAC</text><rect x="180" y="177" width="140" height="46" rx="2" class="node"/><text x="250" y="197" class="title">Decode</text><text x="250" y="213" class="sub">SYMPHONIA</text><rect x="360" y="171" width="160" height="58" rx="2" class="node"/><text x="440" y="191" class="title">The hop chain</text><text x="440" y="207" class="sub">BYTE-DETERMINISTIC</text><text x="440" y="220" class="sub">SIDECARS IF ASKED</text><path d="M150 200 H178" class="edge" marker-end="url(#arrow)"/><path d="M320 200 H358" class="edge" marker-end="url(#arrow)"/><rect x="563" y="67" width="194" height="46" rx="2" class="node" stroke-dasharray="4 3"/><text x="660" y="87" class="title">--analyze</text><text x="660" y="103" class="sub">TEMPO · KEY · SECTIONS</text><path d="M520 200 H540 V90 H561" class="edge" marker-end="url(#arrow)"/><rect x="563" y="142" width="194" height="46" rx="2" class="node" stroke-dasharray="4 3"/><text x="660" y="162" class="title">--signal-dump</text><text x="660" y="178" class="sub">WHAT --signal WOULD SEND</text><path d="M520 200 H540 V165 H561" class="edge" marker-end="url(#arrow)"/><rect x="563" y="217" width="194" height="46" rx="2" class="node" stroke-dasharray="4 3"/><text x="660" y="237" class="title">--render-scene</text><text x="660" y="253" class="sub">FRAMES · NEEDS A GPU</text><path d="M520 200 H540 V240 H561" class="edge" marker-end="url(#arrow)"/><rect x="563" y="292" width="194" height="46" rx="2" class="node"/><text x="660" y="312" class="title">--render-loop</text><text x="660" y="328" class="sub">BEAT-LOCKED VIDEO · FFMPEG</text><path d="M520 200 H540 V315 H561" class="edge" marker-end="url(#arrow)"/><rect x="770" y="70" width="120" height="40" rx="20" class="io"/><text x="830" y="87" class="title">Report</text><text x="830" y="103" class="sub">JSON</text><rect x="770" y="145" width="120" height="40" rx="20" class="io"/><text x="830" y="162" class="title">Bench</text><text x="830" y="178" class="sub">TD COMPARE TOO</text><rect x="770" y="222" width="120" height="36" rx="18" class="io"/><text x="830" y="244.5" class="title">Scene check</text><rect x="770" y="297" width="120" height="36" rx="18" class="io"/><text x="830" y="319.5" class="title">Loop video</text><path d="M757 90 H768" class="edge" marker-end="url(#arrow)"/><path d="M757 165 H768" class="edge" marker-end="url(#arrow)"/><path d="M757 240 H768" class="edge" marker-end="url(#arrow)"/><path d="M757 315 H768" class="edge" marker-end="url(#arrow)"/><text x="450" y="380" class="note" style="text-anchor: middle">dashed: behind --features analyze · solid: in every download</text></svg>
