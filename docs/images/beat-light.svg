" class="title">Settle</text><text x="417.3" y="286.6" class="sub">TRACKERS' CLOCK</text><rect x="415.8" y="418.4" width="112" height="46" rx="2" class="node"/><text x="471.8" y="438.4" class="title">PLL</text><text x="471.8" y="454.4" class="sub">ONSET → PHASE</text><rect x="592.2" y="418.4" width="112" height="46" rx="2" class="node"/><text x="648.2" y="438.4" class="title">Fold</text><text x="648.2" y="454.4" class="sub">8 + 32 BEATS</text><polygon points="702.7,227.6 748.7,273.6 702.7,319.6 656.7,273.6" class="gate"/><text x="702.7" y="271.6" class="title">Vote?</text><text x="702.7" y="286.6" class="sub">2:1 · 1.5:1</text><rect x="485" y="277" width="150" height="46" rx="2" class="node"/><text x="560" y="297" class="title">Grid</text><text x="560" y="313" class="sub">PERIOD · PHASE · TRIM</text><rect x="505" y="347" width="110" height="38" rx="2" class="retry"/><text x="560" y="363" class="title">Shift</text><text x="560" y="379" class="sub">½ · ¼ · ¾ LATER</text><path d="M702.7 321.6 Q672.7 366 617 366" class="edge blue" stroke-dasharray="4 3" marker-end="url(#arrow)"/><path d="M560 347 V325" class="edge blue" marker-end="url(#arrow)"/><text x="692.7" y="406" class="edge-label blue" style="text-anchor: end">three votes in a row</text><rect x="42" y="97" width="136" height="46" rx="2" class="node"/><text x="110" y="117" class="title">Onset flux</text><text x="110" y="133" class="sub">SUPERFLUX · 3 BANDS</text><polygon points="110,184 156,230 110,276 64,230" class="gate"/><text x="110" y="228" class="title">Seed?</text><text x="110" y="243" class="sub">FLUX CONF</text><rect x="29" y="311" width="162" height="58" rx="2" class="node"/><text x="110" y="331" class="title">Tempo</text><text x="110" y="347" class="sub">KALMAN · SUPPORT LOCK</text><text x="110" y="360" class="sub">ANCHOR · PRIOR 150</text><path d="M110 143 V182" class="edge" marker-end="url(#arrow)"/><path d="M110 276 V309" class="edge" marker-end="url(#arrow)"/><text x="124" y="170" class="edge-label" style="text-anchor: start">flux ACF</text><text x="124" y="300" class="edge-label" style="text-anchor: start">≥ .35 once, or ≥ .2 twice 2 s apart</text><path d="M191 340 H480 V300 H483" class="edge" marker-end="url(#arrow)"/><text x="330" y="332" class="edge-label" style="text-anchor: middle">period</text><rect x="225" y="97" width="150" height="46" rx="2" class="node"/><text x="300" y="117" class="title">Activation</text><text x="300" y="133" class="sub">TREES · EVERY HOP</text><path d="M300 143 V320 H193" class="edge" marker-end="url(#arrow)"/><text x="292" y="212" class="edge-label" style="text-anchor: end">chooses the level</text><text x="292" y="226" class="edge-label" style="text-anchor: end">once seeded</text><path d="M375 110 H395 V24 H880 V418" class="edge" marker-end="url(#arrow)"/><text x="640" y="18" class="edge-label" style="text-anchor: middle">peaks ≥ .70 as events</text><rect x="765" y="418" width="130" height="46" rx="2" class="node"/><text x="830" y="438" class="title">Window</text><text x="830" y="454" class="sub">KICKS ∪ PEAKS</text><rect x="765" y="517" width="130" height="46" rx="2" class="node"/><text x="830" y="537" class="title">Kick model</text><text x="830" y="553" class="sub">KICK EVENTS</text><path d="M830 517 V466" class="edge" marker-end="url(#arrow)"/><path d="M765 441 H708" class="edge" marker-end="url(#arrow)"/><rect x="443" y="37" width="234" height="46" rx="23" class="io"/><text x="560" y="57" class="title">Beat</text><text x="560" y="73" class="sub">beat · beat_phase · bpm · locked</text><path d="M560 147 V84" class="edge" marker-end="url(#arrow)"/><rect x="689" y="37" width="182" height="46" rx="2" class="node"/><text x="780" y="57" class="title">Downbeat · structure</text><text x="780" y="73" class="sub">ON THE SETTLED INSTANT</text><path d="M679 60 H687" class="edge" marker-end="url(#arrow)"/></svg>
