<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Signal: in headless --signal the same hop chain feeds an emitter with four cadences, events the hop they are detected with running counts, continuous values decimated to the TX rate, on-change addresses re-broadcast at 1 Hz, and a 1 Hz status heartbeat, over UDP to any OSC receiver; --signal-dump is the same emitter on a file, which is what the bench scores."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7781"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5090e0"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff6040"/></marker></defs><style>
      text { font-family: ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; text-anchor: middle; }
      .title { font-size: 13px; font-weight: 600; fill: #1f2328; }
      .sub { font-size: 9.5px; letter-spacing: 0.06em; fill: #59636e; }
      .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: 0.18em; fill: #59636e; }
      .node { fill: #ffffff; stroke: #8c959f; stroke-width: 1.3; }
      .io { fill: #ffece6; stroke: #ff6040; stroke-width: 1.6; }
      .gate { fill: #e3edfa; stroke: #3a70c0; stroke-width: 1.6; }
      .retry { fill: #eef4fc; stroke: #5090e0; stroke-width: 1.3; }
      .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .group { fill: none; stroke: #b6bec7; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .cam { fill: #ffffff; stroke: #6e7781; stroke-width: 1.1; }
      .edge { fill: none; stroke: #6e7781; stroke-width: 1.5; stroke-linejoin: round; }
      .edge.blue { stroke: #5090e0; marker-end: url(#arrow-blue); }
      .edge.orange { stroke: #ff6040; marker-end: url(#arrow-orange); }
      .edge-label { font-size: 11px; font-style: italic; fill: #59636e; }
      .edge-label.blue { fill: #5090e0; font-style: normal; font-weight: 600; letter-spacing: 0.04em; font-size: 10.5px; }
      .edge-label.orange { fill: #ff6040; font-style: normal; font-weight: 600; letter-spacing: 0.04em; font-size: 10.5px; }
      .note { font-size: 10.5px; fill: #59636e; }
    </style><text x="450" y="32" class="eyebrow" style="text-anchor: middle">ONE CLOCK · THE AUDIO SAMPLE CLOCK · NO WALL TIME IN THE PIPELINE</text><rect x="30" y="191" width="160" height="58" rx="2" class="node"/><text x="110" y="211" class="title">Hop chain</text><text x="110" y="227" class="sub">--signal · HEADLESS</text><text x="110" y="240" class="sub">THE SAME 86 HZ CHAIN</text><rect x="29" y="331" width="162" height="58" rx="2" class="node" stroke-dasharray="4 3"/><text x="110" y="351" class="title">--signal-dump</text><text x="110" y="367" class="sub">FILE IN · JSONL OUT</text><text x="110" y="380" class="sub">WHAT THE BENCH SCORES</text><path d="M110 331 V251" class="edge" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="122" y="300" class="edge-label" style="text-anchor: start">same emitter</text><rect x="285" y="61" width="330" height="58" rx="2" class="node"/><text x="450" y="81" class="title">Events</text><text x="450" y="97" class="sub">beat · downbeat · drop · onset · drums · boundary</text><text x="450" y="110" class="sub">IMMEDIATE · RUNNING COUNTS</text><rect x="285" y="151" width="330" height="58" rx="2" class="node"/><text x="450" y="171" class="title">Continuous</text><text x="450" y="187" class="sub">bpm · locked · bar_phase · build · energy · stems</text><text x="450" y="200" class="sub">phrase · predict/drop · DECIMATED TO 30 HZ</text><rect x="285" y="241" width="330" height="58" rx="2" class="node"/><text x="450" y="261" class="title">On change</text><text x="450" y="277" class="sub">section · key · phrase/len</text><text x="450" y="290" class="sub">ON CHANGE + 1 HZ RE-BROADCAST</text><rect x="285" y="331" width="330" height="58" rx="2" class="node"/><text x="450" y="351" class="title">Status</text><text x="450" y="367" class="sub">online · uptime · device · hop_hz · tier</text><text x="450" y="380" class="sub">1 HZ HEARTBEAT · ONLINE 0 ON EXIT</text><rect x="285" y="412" width="330" height="36" rx="2" class="node" stroke-dasharray="4 3"/><text x="450" y="427" class="title">link/* · feat/&lt;name&gt;</text><text x="450" y="443" class="sub">OPT-IN: --features link · --feat-bus (85)</text><path d="M191 220 H250" class="edge"/><path d="M250 220 V90 H283" class="edge" marker-end="url(#arrow)"/><path d="M250 220 V180 H283" class="edge" marker-end="url(#arrow)"/><path d="M250 220 V270 H283" class="edge" marker-end="url(#arrow)"/><path d="M250 220 V360 H283" class="edge" marker-end="url(#arrow)"/><path d="M250 360 V430 H283" class="edge" stroke-dasharray="4 3" marker-end="url(#arrow)"/><path d="M617 90 H650 V220" class="edge"/><path d="M617 180 H650 V220" class="edge"/><path d="M617 270 H650 V220" class="edge"/><path d="M617 360 H650 V220" class="edge"/><path d="M617 430 H640 V220" class="edge" stroke-dasharray="4 3"/><path d="M650 220 H675" class="edge" marker-end="url(#arrow)"/><rect x="677" y="197" width="206" height="46" rx="23" class="io"/><text x="780" y="217" class="title">Rig</text><text x="780" y="233" class="sub">TOUCHDESIGNER · RESOLUME · MAX</text><text x="662" y="212" class="edge-label" style="text-anchor: middle">UDP</text></svg>
