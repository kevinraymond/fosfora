<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" width="920" height="680" role="img" aria-label="Fosfora by tier: a production chain (audio in, capture, the 86 Hz per-hop chain, the frame, visuals to window and sinks, Signal to rigs) in every build; sidecars and logs that ship but only record when an env var names a file; dev tooling behind the analyze feature (offline CLI, bench, replicas, model training) whose trained model ships back into the chain."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5090e0"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff6040"/></marker></defs><style>
      text { font-family: ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; text-anchor: middle; }
      .title { font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .sub { font-size: 9.5px; letter-spacing: 0.06em; fill: #9198a1; }
      .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: 0.18em; fill: #9198a1; }
      .node { fill: #0d1117; stroke: #6e7681; stroke-width: 1.3; }
      .io { fill: #4a2317; stroke: #ff6040; stroke-width: 1.6; }
      .gate { fill: #14305c; stroke: #5090e0; stroke-width: 1.6; }
      .retry { fill: #1a2740; stroke: #5090e0; stroke-width: 1.3; }
      .band { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .group { fill: none; stroke: #484f58; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .cam { fill: #0d1117; stroke: #8b949e; stroke-width: 1.1; }
      .edge { fill: none; stroke: #8b949e; stroke-width: 1.5; stroke-linejoin: round; }
      .edge.blue { stroke: #5090e0; marker-end: url(#arrow-blue); }
      .edge.orange { stroke: #ff6040; marker-end: url(#arrow-orange); }
      .edge-label { font-size: 11px; font-style: italic; fill: #9198a1; }
      .edge-label.blue { fill: #5090e0; font-style: normal; font-weight: 600; letter-spacing: 0.04em; font-size: 10.5px; }
      .edge-label.orange { fill: #ff6040; font-style: normal; font-weight: 600; letter-spacing: 0.04em; font-size: 10.5px; }
      .note { font-size: 10.5px; fill: #9198a1; }
    </style><rect x="30" y="20" width="875" height="270" rx="6" class="band"/><text x="44" y="40" class="eyebrow" style="text-anchor: start">PRODUCTION · EVERY RELEASE BUILD · THE SAME CHAIN LIVE, HEADLESS AND OFFLINE</text><rect x="30" y="127" width="100" height="46" rx="23" class="io"/><text x="80" y="147" class="title">Audio in</text><text x="80" y="163" class="sub">DEVICE · FILE</text><rect x="145" y="127" width="110" height="46" rx="2" class="node"/><text x="200" y="147" class="title">Capture</text><text x="200" y="163" class="sub">CPAL · WASAPI</text><rect x="275" y="127" width="170" height="46" rx="2" class="node"/><text x="360" y="147" class="title">Per-hop chain</text><text x="360" y="163" class="sub">FFT · BEAT · KEY · MORE</text><rect x="453" y="127" width="144" height="46" rx="2" class="node"/><text x="525" y="147" class="title">Frame</text><text x="525" y="163" class="sub">85 FEATURES · EVENTS</text><rect x="615" y="77" width="130" height="46" rx="2" class="node"/><text x="680" y="97" class="title">Signal</text><text x="680" y="113" class="sub">OSC · --signal</text><rect x="615" y="177" width="130" height="46" rx="2" class="node"/><text x="680" y="197" class="title">Visuals</text><text x="680" y="213" class="sub">BINDINGS · LAYERS</text><rect x="615" y="232" width="130" height="46" rx="2" class="node"/><text x="680" y="252" class="title">Controls</text><text x="680" y="268" class="sub">MIDI · OSC · WEB</text><rect x="760" y="77" width="140" height="46" rx="23" class="io"/><text x="830" y="97" class="title">Rigs</text><text x="830" y="113" class="sub">TD · RESOLUME · MAX</text><rect x="759" y="171" width="142" height="58" rx="2" class="io"/><text x="830" y="191" class="title">Outputs</text><text x="830" y="207" class="sub">WINDOW · NDI · SPOUT</text><text x="830" y="220" class="sub">SYPHON · VCAM · MP4</text><path d="M130 150 H143" class="edge" marker-end="url(#arrow)"/><path d="M255 150 H273" class="edge" marker-end="url(#arrow)"/><path d="M445 150 H451" class="edge" marker-end="url(#arrow)"/><path d="M597 142 H605 V100 H613" class="edge" marker-end="url(#arrow)"/><path d="M597 158 H605 V200 H613" class="edge" marker-end="url(#arrow)"/><path d="M680 232 V225" class="edge" marker-end="url(#arrow)"/><path d="M745 100 H758" class="edge" marker-end="url(#arrow)"/><path d="M745 200 H758" class="edge" marker-end="url(#arrow)"/><rect x="30" y="310" width="875" height="120" rx="6" class="band"/><text x="44" y="330" class="eyebrow" style="text-anchor: start">INSTRUMENTATION · IN EVERY BUILD, INERT UNTIL AN ENV VAR NAMES A FILE · RECORDS, NEVER DECIDES</text><rect x="125" y="352" width="150" height="46" rx="2" class="node" stroke-dasharray="4 3"/><text x="200" y="372" class="title">Hop sidecar</text><text x="200" y="388" class="sub">FOSFORA_HOP_SIDECAR</text><rect x="285" y="352" width="150" height="46" rx="2" class="node" stroke-dasharray="4 3"/><text x="360" y="372" class="title">Beat sidecar</text><text x="360" y="388" class="sub">FOSFORA_BEAT_SIDECAR</text><rect x="450" y="352" width="150" height="46" rx="2" class="node" stroke-dasharray="4 3"/><text x="525" y="372" class="title">Key · structure</text><text x="525" y="388" class="sub">FOSFORA_*_SIDECAR</text><rect x="685" y="352" width="150" height="46" rx="2" class="node" stroke-dasharray="4 3"/><text x="760" y="372" class="title">Frame log</text><text x="760" y="388" class="sub">FOSFORA_FRAME_LOG</text><path d="M300 173 V240 H200 V351" class="edge" stroke-dasharray="4 3" marker-end="url(#arrow)"/><path d="M360 173 V351" class="edge" stroke-dasharray="4 3" marker-end="url(#arrow)"/><path d="M420 173 V240 H525 V351" class="edge" stroke-dasharray="4 3" marker-end="url(#arrow)"/><path d="M745 215 H752 V351" class="edge" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="30" y="450" width="875" height="210" rx="6" class="band"/><text x="44" y="470" class="eyebrow" style="text-anchor: start">DEV TOOLING · --features analyze · NEVER IN A DOWNLOAD</text><rect x="125" y="481" width="150" height="58" rx="2" class="node"/><text x="200" y="501" class="title">Model training</text><text x="200" y="517" class="sub">scripts/beat_model</text><text x="200" y="530" class="sub">scripts/kick_model</text><rect x="315" y="481" width="190" height="58" rx="2" class="node"/><text x="410" y="501" class="title">Offline CLI</text><text x="410" y="517" class="sub">--signal-dump · --analyze</text><text x="410" y="530" class="sub">--render-scene · --validate</text><rect x="523" y="481" width="184" height="58" rx="2" class="node"/><text x="615" y="501" class="title">Bench</text><text x="615" y="517" class="sub">DATASETS · MANIFESTS</text><text x="615" y="530" class="sub">ARMS · VERDICT · HOLDOUT</text><rect x="725" y="487" width="150" height="46" rx="2" class="node"/><text x="800" y="507" class="title">Replicas</text><text x="800" y="523" class="sub">REPLAYS · FORECASTS</text><rect x="125" y="582" width="150" height="46" rx="23" class="io"/><text x="200" y="602" class="title">beat_model.json</text><text x="200" y="618" class="sub">TREES · LAG · PICKER</text><path d="M200 399 V480" class="edge" stroke-dasharray="4 3" marker-end="url(#arrow)"/><path d="M360 399 V440 H800 V480" class="edge" stroke-dasharray="4 3" marker-end="url(#arrow)"/><path d="M525 399 V440" class="edge" stroke-dasharray="4 3"/><path d="M505 510 H521" class="edge" marker-end="url(#arrow)"/><path d="M707 510 H723" class="edge" marker-end="url(#arrow)"/><path d="M200 539 V581" class="edge" marker-end="url(#arrow)"/><path d="M122 605 H15 V60 H360 V126" class="edge orange" marker-end="url(#arrow)"/><text x="190" y="55" class="edge-label orange" style="text-anchor: middle">the trained model ships inside the chain</text></svg>
