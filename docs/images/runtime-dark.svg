<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="Fosfora at runtime: input threads (MIDI, OSC, web, capture into the audio thread's hop chain, a file watcher, an optional depth thread) feed the main thread through channels; the main thread drains inputs, applies bindings, renders per-layer passes, composites, post-processes, draws egui and presents; readback feeds sink threads (NDI, Spout, Syphon, v4l2) and recording; web clients and OSC out are broadcast from the main thread."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5090e0"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff6040"/></marker></defs><style>
      text { font-family: ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; text-anchor: middle; }
      .title { font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .sub { font-size: 9.5px; letter-spacing: 0.06em; fill: #9198a1; }
      .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: 0.18em; fill: #9198a1; }
      .node { fill: #0d1117; stroke: #6e7681; stroke-width: 1.3; }
      .io { fill: #4a2317; stroke: #ff6040; stroke-width: 1.6; }
      .gate { fill: #14305c; stroke: #5090e0; stroke-width: 1.6; }
      .retry { fill: #1a2740; stroke: #5090e0; stroke-width: 1.3; }
      .band { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .group { fill: none; stroke: #484f58; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .cam { fill: #0d1117; stroke: #8b949e; stroke-width: 1.1; }
      .edge { fill: none; stroke: #8b949e; stroke-width: 1.5; stroke-linejoin: round; }
      .edge.blue { stroke: #5090e0; marker-end: url(#arrow-blue); }
      .edge.orange { stroke: #ff6040; marker-end: url(#arrow-orange); }
      .edge-label { font-size: 11px; font-style: italic; fill: #9198a1; }
      .edge-label.blue { fill: #5090e0; font-style: normal; font-weight: 600; letter-spacing: 0.04em; font-size: 10.5px; }
      .edge-label.orange { fill: #ff6040; font-style: normal; font-weight: 600; letter-spacing: 0.04em; font-size: 10.5px; }
      .note { font-size: 10.5px; fill: #9198a1; }
    </style><rect x="325" y="30" width="250" height="560" rx="6" class="group"/><text x="339" y="50" class="eyebrow" style="text-anchor: start">MAIN THREAD · EVERY FRAME</text><rect x="345" y="67" width="210" height="46" rx="2" class="node"/><text x="450" y="87" class="title">Drain inputs</text><text x="450" y="103" class="sub">MIDI → OSC → WEB</text><rect x="345" y="137" width="210" height="46" rx="2" class="node"/><text x="450" y="157" class="title">Bindings → params</text><text x="450" y="173" class="sub">LATEST FRAME · TRANSFORMS</text><rect x="345" y="207" width="210" height="46" rx="2" class="node"/><text x="450" y="227" class="title">Per-layer passes</text><text x="450" y="243" class="sub">COMPUTE · EFFECT · PARTICLES</text><rect x="345" y="277" width="210" height="46" rx="2" class="node"/><text x="450" y="297" class="title">Compositor</text><text x="450" y="313" class="sub">BLEND · DISPLACE · HDR</text><rect x="345" y="347" width="210" height="46" rx="2" class="node"/><text x="450" y="367" class="title">Post-process</text><text x="450" y="383" class="sub">BLOOM · TONEMAP</text><rect x="345" y="417" width="210" height="46" rx="2" class="node"/><text x="450" y="437" class="title">egui overlay</text><text x="450" y="453" class="sub">PANELS · SHELL</text><rect x="345" y="487" width="210" height="46" rx="2" class="node"/><text x="450" y="507" class="title">Present + readback</text><text x="450" y="523" class="sub">SURFACE · FRAME CAPTURE</text><path d="M450 113 V135" class="edge" marker-end="url(#arrow)"/><path d="M450 183 V205" class="edge" marker-end="url(#arrow)"/><path d="M450 253 V275" class="edge" marker-end="url(#arrow)"/><path d="M450 323 V345" class="edge" marker-end="url(#arrow)"/><path d="M450 393 V415" class="edge" marker-end="url(#arrow)"/><path d="M450 463 V485" class="edge" marker-end="url(#arrow)"/><rect x="45" y="27" width="150" height="46" rx="2" class="node"/><text x="120" y="47" class="title">MIDI thread</text><text x="120" y="63" class="sub">MIDIR · BOUNDED 64</text><rect x="45" y="87" width="150" height="46" rx="2" class="node"/><text x="120" y="107" class="title">OSC thread</text><text x="120" y="123" class="sub">ROSC UDP · BOUNDED 64</text><rect x="45" y="146" width="150" height="58" rx="2" class="node"/><text x="120" y="166" class="title">Web threads</text><text x="120" y="182" class="sub">ONE PER CLIENT</text><text x="120" y="195" class="sub">HTTP · WS · JSON</text><rect x="45" y="237" width="150" height="46" rx="2" class="node"/><text x="120" y="257" class="title">Capture</text><text x="120" y="273" class="sub">CPAL · WASAPI · PULSE</text><rect x="45" y="306" width="150" height="58" rx="2" class="node"/><text x="120" y="326" class="title">Audio thread</text><text x="120" y="342" class="sub">HOP CHAIN · 86 HZ</text><text x="120" y="355" class="sub">AudioFrame CHANNEL</text><rect x="45" y="397" width="150" height="46" rx="2" class="node"/><text x="120" y="417" class="title">File watcher</text><text x="120" y="433" class="sub">NOTIFY · DEBOUNCED</text><rect x="45" y="467" width="150" height="46" rx="2" class="node" stroke-dasharray="4 3"/><text x="120" y="487" class="title">Depth thread</text><text x="120" y="503" class="sub">DEPTH ANYTHING</text><path d="M201 50 H290 V90" class="edge"/><path d="M201 110 H290 V90" class="edge"/><path d="M201 175 H290 V90" class="edge"/><path d="M290 90 H343" class="edge" marker-end="url(#arrow)"/><path d="M120 273 V304" class="edge" marker-end="url(#arrow)"/><path d="M195 335 H310 V160 H343" class="edge" marker-end="url(#arrow)"/><path d="M195 420 H320" class="edge"/><path d="M195 490 H320 V230 H343" class="edge" marker-end="url(#arrow)"/><text x="338" y="82" class="edge-label" style="text-anchor: end">last write wins</text><text x="338" y="152" class="edge-label" style="text-anchor: end">one frame per hop</text><text x="338" y="222" class="edge-label" style="text-anchor: end">shader reload · depth maps</text><rect x="685" y="67" width="190" height="46" rx="2" class="node"/><text x="780" y="87" class="title">Web clients</text><text x="780" y="103" class="sub">SNAPSHOT · AUDIO 10 HZ</text><rect x="685" y="137" width="190" height="46" rx="2" class="node"/><text x="780" y="157" class="title">OSC out</text><text x="780" y="173" class="sub">/fosfora/audio/*</text><rect x="678" y="411" width="204" height="58" rx="2" class="node"/><text x="780" y="431" class="title">Sink threads</text><text x="780" y="447" class="sub">NDI · SPOUT · SYPHON · V4L2</text><text x="780" y="460" class="sub">FRAME CHANNEL · HEALTH</text><rect x="685" y="491" width="190" height="58" rx="2" class="node"/><text x="780" y="511" class="title">Recording</text><text x="780" y="527" class="sub">ENCODER + AUDIO THREADS</text><text x="780" y="540" class="sub">FFMPEG · MP4</text><path d="M555 90 H683" class="edge" marker-end="url(#arrow)"/><path d="M555 160 H683" class="edge" marker-end="url(#arrow)"/><path d="M555 510 H640 V440 H676" class="edge" marker-end="url(#arrow)"/><path d="M640 510 V520 H683" class="edge" marker-end="url(#arrow)"/><text x="565" y="82" class="edge-label" style="text-anchor: start">broadcast</text><text x="565" y="152" class="edge-label" style="text-anchor: start">features + pulses</text><text x="565" y="502" class="edge-label" style="text-anchor: start">readback</text><text x="450" y="606" class="note" style="text-anchor: middle">no mutex in the hot path: every edge is a channel, drained in order each frame</text></svg>
