<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="Fosfora's data flow: audio, controls, presets and media come in; the analysis feeds Signal (to rigs over OSC) and the bindings that drive per-layer params; layers composite and post-process into the window and the sinks; the app also broadcasts its own telemetry over OSC and to web clients."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7781"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5090e0"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff6040"/></marker></defs><style>
      text { font-family: ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; text-anchor: middle; }
      .title { font-size: 13px; font-weight: 600; fill: #1f2328; }
      .sub { font-size: 9.5px; letter-spacing: 0.06em; fill: #59636e; }
      .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: 0.18em; fill: #59636e; }
      .node { fill: #ffffff; stroke: #8c959f; stroke-width: 1.3; }
      .io { fill: #ffece6; stroke: #ff6040; stroke-width: 1.6; }
      .gate { fill: #e3edfa; stroke: #3a70c0; stroke-width: 1.6; }
      .retry { fill: #eef4fc; stroke: #5090e0; stroke-width: 1.3; }
      .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .group { fill: none; stroke: #b6bec7; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .cam { fill: #ffffff; stroke: #6e7781; stroke-width: 1.1; }
      .edge { fill: none; stroke: #6e7781; stroke-width: 1.5; stroke-linejoin: round; }
      .edge.blue { stroke: #5090e0; marker-end: url(#arrow-blue); }
      .edge.orange { stroke: #ff6040; marker-end: url(#arrow-orange); }
      .edge-label { font-size: 11px; font-style: italic; fill: #59636e; }
      .edge-label.blue { fill: #5090e0; font-style: normal; font-weight: 600; letter-spacing: 0.04em; font-size: 10.5px; }
      .edge-label.orange { fill: #ff6040; font-style: normal; font-weight: 600; letter-spacing: 0.04em; font-size: 10.5px; }
      .note { font-size: 10.5px; fill: #59636e; }
    </style><rect x="19" y="127" width="162" height="46" rx="23" class="io"/><text x="100" y="147" class="title">Audio</text><text x="100" y="163" class="sub">DEVICE · MONITOR · FILE</text><rect x="19" y="237" width="162" height="46" rx="23" class="io"/><text x="100" y="257" class="title">Controls</text><text x="100" y="273" class="sub">MIDI · OSC · WEB · LINK</text><rect x="25" y="347" width="150" height="46" rx="23" class="io"/><text x="100" y="367" class="title">Presets · scenes</text><text x="100" y="383" class="sub">JSON · TRAMA GRAPHS</text><rect x="19" y="437" width="162" height="46" rx="23" class="io"/><text x="100" y="457" class="title">Media</text><text x="100" y="473" class="sub">VIDEO · WEBCAM · SPLATS</text><rect x="235" y="127" width="170" height="46" rx="2" class="node"/><text x="320" y="147" class="title">Analysis</text><text x="320" y="163" class="sub">85 FEATURES · EVENTS</text><rect x="440" y="127" width="200" height="46" rx="2" class="node"/><text x="540" y="147" class="title">Signal</text><text x="540" y="163" class="sub">FOUR CADENCES · /fosfora/v1</text><rect x="715" y="127" width="150" height="46" rx="23" class="io"/><text x="790" y="147" class="title">Rigs</text><text x="790" y="163" class="sub">TD · RESOLUME · MAX</text><rect x="449" y="37" width="182" height="46" rx="2" class="node" stroke-dasharray="4 3"/><text x="540" y="57" class="title">OSC out · web</text><text x="540" y="73" class="sub">/fosfora/audio/* · 10 HZ</text><rect x="709" y="37" width="162" height="46" rx="23" class="io" stroke-dasharray="4 3"/><text x="790" y="57" class="title">Listeners</text><text x="790" y="73" class="sub">THE APP'S OWN TELEMETRY</text><rect x="235" y="237" width="170" height="46" rx="2" class="node"/><text x="320" y="257" class="title">Bindings</text><text x="320" y="273" class="sub">SOURCES → TARGETS</text><rect x="465" y="237" width="150" height="46" rx="2" class="node"/><text x="540" y="257" class="title">Params</text><text x="540" y="273" class="sub">ONE STORE PER LAYER</text><rect x="709" y="237" width="162" height="46" rx="2" class="node"/><text x="790" y="257" class="title">Layers</text><text x="790" y="273" class="sub">EFFECTS · MEDIA · TRAMA</text><rect x="711" y="347" width="158" height="46" rx="2" class="node"/><text x="790" y="367" class="title">Compositor + post</text><text x="790" y="383" class="sub">13 BLENDS · BLOOM</text><rect x="715" y="451" width="150" height="58" rx="2" class="io"/><text x="790" y="471" class="title">Outputs</text><text x="790" y="487" class="sub">WINDOW · NDI · SPOUT</text><text x="790" y="500" class="sub">SYPHON · VCAM · MP4</text><path d="M190 150 H233" class="edge" marker-end="url(#arrow)"/><path d="M405 150 H438" class="edge" marker-end="url(#arrow)"/><path d="M640 150 H713" class="edge" marker-end="url(#arrow)"/><path d="M320 127 V60 H447" class="edge" stroke-dasharray="4 3" marker-end="url(#arrow)"/><path d="M631 60 H713" class="edge" stroke-dasharray="4 3" marker-end="url(#arrow)"/><path d="M320 173 V235" class="edge" marker-end="url(#arrow)"/><path d="M190 260 H233" class="edge" marker-end="url(#arrow)"/><path d="M405 260 H463" class="edge" marker-end="url(#arrow)"/><path d="M615 260 H713" class="edge" marker-end="url(#arrow)"/><path d="M190 370 H540 V285" class="edge" marker-end="url(#arrow)"/><path d="M190 460 H690 V272 H713" class="edge" marker-end="url(#arrow)"/><path d="M790 283 V345" class="edge" marker-end="url(#arrow)"/><path d="M790 393 V449" class="edge" marker-end="url(#arrow)"/><text x="212" y="142" class="edge-label" style="text-anchor: middle">hop chain</text><text x="422" y="142" class="edge-label" style="text-anchor: middle">same chain</text><text x="330" y="210" class="edge-label" style="text-anchor: start">every hop</text><text x="380" y="52" class="edge-label" style="text-anchor: middle">features + pulses, per frame</text></svg>
