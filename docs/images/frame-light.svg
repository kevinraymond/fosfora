<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="One frame: drain MIDI, OSC and web inputs, apply bindings to the per-layer params from the latest audio frame, then for each enabled layer run compute, effect passes and particle render; composite, post-process, draw egui, present, and read back for the sinks."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7781"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5090e0"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff6040"/></marker></defs><style>
      text { font-family: ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; text-anchor: middle; }
      .title { font-size: 13px; font-weight: 600; fill: #1f2328; }
      .sub { font-size: 9.5px; letter-spacing: 0.06em; fill: #59636e; }
      .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: 0.18em; fill: #59636e; }
      .node { fill: #ffffff; stroke: #8c959f; stroke-width: 1.3; }
      .io { fill: #ffece6; stroke: #ff6040; stroke-width: 1.6; }
      .gate { fill: #e3edfa; stroke: #3a70c0; stroke-width: 1.6; }
      .retry { fill: #eef4fc; stroke: #5090e0; stroke-width: 1.3; }
      .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .group { fill: none; stroke: #b6bec7; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .cam { fill: #ffffff; stroke: #6e7781; stroke-width: 1.1; }
      .edge { fill: none; stroke: #6e7781; stroke-width: 1.5; stroke-linejoin: round; }
      .edge.blue { stroke: #5090e0; marker-end: url(#arrow-blue); }
      .edge.orange { stroke: #ff6040; marker-end: url(#arrow-orange); }
      .edge-label { font-size: 11px; font-style: italic; fill: #59636e; }
      .edge-label.blue { fill: #5090e0; font-style: normal; font-weight: 600; letter-spacing: 0.04em; font-size: 10.5px; }
      .edge-label.orange { fill: #ff6040; font-style: normal; font-weight: 600; letter-spacing: 0.04em; font-size: 10.5px; }
      .note { font-size: 10.5px; fill: #59636e; }
    </style><text x="450" y="32" class="eyebrow" style="text-anchor: middle">EVERY FRAME · THE MAIN THREAD · NO MUTEX IN THE HOT PATH</text><rect x="45" y="77" width="190" height="46" rx="2" class="node"/><text x="140" y="97" class="title">Drain inputs</text><text x="140" y="113" class="sub">MIDI → OSC → WEB</text><rect x="45" y="157" width="190" height="46" rx="2" class="node"/><text x="140" y="177" class="title">Bindings → params</text><text x="140" y="193" class="sub">LATEST FRAME → PARAMS</text><path d="M140 123 V155" class="edge" marker-end="url(#arrow)"/><path d="M235 180 H230 V320 H278" class="edge" marker-end="url(#arrow)"/><path id="layerpath" d="M251.5 255 A190 190 0 0 1 463 132.9" fill="none"/><text class="eyebrow"><textPath href="#layerpath" startOffset="50%" style="text-anchor: middle">FOR EACH ENABLED LAYER</textPath></text><path d="M373.8 180.9 A150 150 0 0 0 281.5 340.9" class="edge" marker-end="url(#arrow)"/><path d="M337.7 438.2 A150 150 0 0 0 522.3 438.2" class="edge" marker-end="url(#arrow)"/><path d="M578.5 340.9 A150 150 0 0 0 486.2 180.9" class="edge" marker-end="url(#arrow)"/><circle cx="580" cy="320" r="2.4" class="cam"/><circle cx="578.5" cy="299.1" r="2.4" class="cam"/><circle cx="574.2" cy="278.7" r="2.4" class="cam"/><circle cx="567" cy="259" r="2.4" class="cam"/><circle cx="557.2" cy="240.5" r="2.4" class="cam"/><circle cx="544.9" cy="223.6" r="2.4" class="cam"/><circle cx="530.4" cy="208.5" r="2.4" class="cam"/><circle cx="513.9" cy="195.6" r="2.4" class="cam"/><circle cx="495.8" cy="185.2" r="2.4" class="cam"/><circle cx="476.4" cy="177.3" r="2.4" class="cam"/><circle cx="456" cy="172.3" r="2.4" class="cam"/><circle cx="435.2" cy="170.1" r="2.4" class="cam"/><circle cx="414.3" cy="170.8" r="2.4" class="cam"/><circle cx="393.7" cy="174.5" r="2.4" class="cam"/><circle cx="373.8" cy="180.9" r="2.4" class="cam"/><circle cx="355" cy="190.1" r="2.4" class="cam"/><circle cx="337.7" cy="201.8" r="2.4" class="cam"/><circle cx="322.1" cy="215.8