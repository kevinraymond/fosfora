[graph]
targets = []
all-features = true

[advisories]
unmaintained = "all"
yanked = "warn"
ignore = [
    # quick-xml < 0.41 DoS advisories (quadratic duplicate-attribute check,
    # unbounded namespace allocation). Our only quick-xml consumer is
    # wayland-scanner, a build-time proc-macro that parses the trusted Wayland
    # protocol XML bundled in the crates — no untrusted XML is parsed at
    # runtime. Remove once wayland-scanner allows quick-xml >= 0.41.
    { id = "RUSTSEC-2026-0194", reason = "build-time only; parses trusted bundled protocol XML" },
    { id = "RUSTSEC-2026-0195", reason = "build-time only; parses trusted bundled protocol XML" },
    # Unmaintained transitive crates. `unmaintained = "all"` surfaces these;
    # each is pinned by an upstream we can't replace yet. Drop the entry when
    # its path goes away.
    { id = "RUSTSEC-2024-0436", reason = "paste (proc-macro, build-time): via metal 0.32 under wgpu-hal 27 and via nokhwa 0.10; no maintained alternative upstream, goes when both move off it" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.21 via fontdue 0.9 (our text rendering) and 0.25 via ab_glyph under egui/epaint and sctk-adwaita; parses only bundled and system fonts, never user input; replace when fontdue and egui move to skrifa" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "IJG",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
    # Ableton Link (vendored by rusty_link) is GPL-2.0-or-later, dual-licensed
    # proprietary by Ableton. Only opt-in `--features link` builds link it —
    # default and release builds don't (the `release` feature excludes
    # it), so shipped binaries stay MIT/Apache. The all-features graph scan
    # still walks the optional dep, hence this crate-scoped exception.
    { name = "rusty_link", allow = ["GPL-2.0-or-later"] },
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
