name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  demos:
    name: Capture demo presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every way a demo preset can be wrong is silent at runtime — an unknown param is
      # dropped without a log line, a missing obstacle image logs nothing at all — so a
      # rename here surfaces as a capture run that quietly films the wrong thing.
      - run: scripts/capture/check_demos.py

  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deny check
        uses: EmbarkStudios/cargo-deny-action@v2

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        timeout-minutes: 15
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 libasound2-dev libudev-dev libclang-dev
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (video feature)
        run: cargo clippy --all-targets --features video -- -D warnings
      - name: Clippy (webcam feature)
        run: cargo clippy --all-targets --features webcam -- -D warnings
      - name: Clippy (depth feature)
        run: cargo clippy --all-targets --features depth -- -D warnings
      - name: Clippy (analyze feature)
        run: cargo clippy --all-targets --features analyze -- -D warnings
      - name: Clippy (link feature)
        run: cargo clippy --all-targets --features link -- -D warnings
      - name: Clippy (output sinks)
        run: cargo clippy --all-targets --features "ndi,v4l2,spout,syphon" -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ffmpeg for the loop-export encode tests, which probe the real binary
      # (decision #2066); the renders themselves need a GPU and stay dev-run.
      # ffmpeg is NOT on the ubuntu-24.04 runner image, so this apt call is load-bearing.
      # One update for both, not two: this used to be two steps that each synced the
      # mirrors, which doubled the exposure to an azure.archive.ubuntu.com stall for no
      # benefit — one of those stalls hung the job for 51 min before anything built.
      # Same 15-minute cap as every other apt step. These normally run in 5-83 s (measured
      # across six healthy runs), so the cap only ever fires on a genuinely bad mirror day —
      # it is here to bound a hang, not to police throughput. Two tighter values were tried
      # and both killed work that was progressing: ffmpeg's ~100-package codec tree and
      # libclang-dev's LLVM tree are each well past 6 minutes when the mirror is degraded.
      - name: Install system deps
        timeout-minutes: 15
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 \
            ffmpeg libasound2-dev libudev-dev libclang-dev
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test
      - name: Test (video feature)
        run: cargo test --features video
      - name: Test (webcam feature)
        run: cargo test --features webcam
      - name: Test (depth feature)
        run: cargo test --features depth
      - name: Test (analyze feature)
        run: cargo test --features analyze
      - name: Test (link feature)
        run: cargo test --features link
      - name: Test (output sinks)
        run: cargo test --features "ndi,v4l2,spout,syphon"

  bench-fixture:
    name: Bench fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        timeout-minutes: 15
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 libasound2-dev libudev-dev libclang-dev
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      # Debug build on purpose: the dev profile runs deps at opt-level 2, so the
      # DSP chain is near release speed without populating a separate lto=fat
      # release cache. Same profile the test job already exercises.
      - name: Build (analyze feature)
        run: cargo build --features analyze
      - name: Benchlib unit tests
        run: bench/test_benchlib.py
      - name: Fixture end-to-end (generate -> dump -> score -> assert floors)
        run: |
          bench/make_fixture.py -o bench/out/fixture
          FOSFORA_BIN=target/debug/fosfora bench/check_fixture.py bench/out/fixture

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 libasound2-dev libudev-dev libclang-dev
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.target }}-v3
      # Clippy per native target so cfg-gated Windows/macOS code is actually linted
      # (the host-only lint job and pre-commit hook never see it). See board #1500.
      - name: Clippy (cross-target)
        run: cargo clippy --target ${{ matrix.target }} -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --target ${{ matrix.target }} --features "video,webcam,ndi,v4l2,spout,syphon" -- -D warnings
      - name: Build
        run: cargo build --target ${{ matrix.target }}
      - name: Build (video feature)
        run: cargo build --target ${{ matrix.target }} --features video
      - name: Build (webcam feature)
        run: cargo build --target ${{ matrix.target }} --features webcam
      - name: Build (depth feature)
        run: cargo build --target ${{ matrix.target }} --features depth
      - name: Build (all features)
        run: cargo build --target ${{ matrix.target }} --features "video,webcam,ndi,v4l2,spout,syphon"

      - name: Stage artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/debug/fosfora staging/
          cp -r assets staging/
      - name: Stage artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/debug/fosfora staging/
          cp -r assets staging/
      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir staging
          copy target\${{ matrix.target }}\debug\fosfora.exe staging\
          xcopy assets staging\assets\ /E /I /Q
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fosfora-ci-${{ matrix.target }}
          path: staging/
          retention-days: 7

  # Tagging lives in its own workflow (tag.yml), NOT here: this workflow uses
  # paths-ignore '**.md', so a CHANGELOG/docs-only fix never reaches a job here.
  # When the release guards failed on such a fix, the tag stayed stuck (hit
  # shipping v1.17.0). tag.yml triggers on the release-relevant paths instead.
