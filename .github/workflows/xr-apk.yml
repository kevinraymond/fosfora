name: XR APK

# Builds the Quest debug APK (crates/fosfora-xr + android/) on every push to
# `xr`, signed with one stable debug key so consecutive artifacts install over
# each other with `adb install -r`. The desktop checks run from ci.yml.
#
# The repo is public, and so are its workflow artifacts, so the APK is uploaded
# only age-encrypted to the XR_APK_AGE_RECIPIENT repository variable (a public
# key). Decrypt with the matching identity:
#   age -d -i ~/.config/age/fosfora-xr.txt fosfora-xr-debug-<sha>.apk.age > x.apk
#
# The APK bundles the voice path's speech model (ggml-base.en.bin, 148 MB,
# board #3751), so the encrypted artifact is about 148 MB larger than before
# it. The model is fetched with its checksum (scripts/xr/fetch-model.sh) and
# cached below; the whisper.cpp cross build's toolchain variables come from
# scripts/xr/run.sh, for lint and build alike (the runner has cmake and
# libclang). V5's on-device decision model and its tokenizer files are
# fetched and cached the same way once MODELS.txt has their URL; until then
# (a placeholder) the fetch notes it and the APK builds without them, the
# provider off at runtime. ONNX Runtime comes from its Maven AAR through
# Gradle, like the OpenXR loader.

on:
  push:
    branches: [xr]
    paths:
      - 'crates/**'
      - 'android/**'
      - 'assets/**'
      - 'scripts/xr/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.github/workflows/xr-apk.yml'
  # Same-repo PRs into `xr` get the secrets too, so a change to this workflow
  # or the Gradle project is proven before it lands.
  pull_request:
    branches: [xr]
    paths:
      - 'crates/**'
      - 'android/**'
      - 'assets/**'
      - 'scripts/xr/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.github/workflows/xr-apk.yml'
  workflow_dispatch:

concurrency:
  group: xr-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same NDK as the dev host (docs/xr/MEASURED.md, S0), so CI and local builds
  # link against the same sysroot. Installed below if the runner image lacks it.
  XR_NDK_VERSION: 27.0.12077973
  CARGO_NDK_VERSION: 4.1.2

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # First, before any build: without a recipient there is nothing safe to upload.
      - name: Encryption recipient
        env:
          RECIPIENT: ${{ vars.XR_APK_AGE_RECIPIENT }}
        run: |
          case "$RECIPIENT" in
            age1*) echo "age recipient: $RECIPIENT" ;;
            *)
              echo "::error title=Missing age recipient::Set the XR_APK_AGE_RECIPIENT repository variable (Settings > Secrets and variables > Actions > Variables) to an age public key (age1...)."
              cat <<'EOF'
          The APK artifact is uploaded only age-encrypted, because artifacts on a
          public repo are downloadable by anyone signed in to GitHub. Once:

            age-keygen -o ~/.config/age/fosfora-xr.txt   # prints "Public key: age1..."
            gh variable set XR_APK_AGE_RECIPIENT --body age1...
          EOF
              exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android
          components: clippy

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android NDK
        run: |
          ndk="$ANDROID_HOME/ndk/$XR_NDK_VERSION"
          if [ ! -d "$ndk" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$XR_NDK_VERSION" > /dev/null
          fi
          echo "NDK: $(grep Pkg.Revision "$ndk/source.properties")  ($ndk)"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: xr-apk-aarch64-linux-android

      - name: Cache cargo-ndk
        id: cargo-ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ runner.os }}
      # rust-cache restores ~/.cargo/bin too, so the binary can be present
      # while this step's own cache missed (its entry evicted by the larger
      # caches below): check the installed version instead of the cache hit.
      - name: Install cargo-ndk
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: |
          if cargo ndk --version 2>/dev/null | grep -q "$CARGO_NDK_VERSION"; then
            echo "cargo-ndk $CARGO_NDK_VERSION already installed"
          else
            cargo install cargo-ndk --locked --force --version "$CARGO_NDK_VERSION"
          fi

      # The speech model, keyed on its SHA-256 so a run downloads it only
      # when the cache is cold; fetch-model.sh verifies a restored file too.
      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: assets/xr/models/ggml-base.en.bin
          key: whisper-ggml-base.en-a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002
      # V5's decision model and its tokenizer files, keyed on the model's
      # SHA-256 (assets/xr/models/MODELS.txt). With the URL still a
      # placeholder there is nothing to fetch or cache: the fetch step
      # below is a no-op for them with a notice.
      - name: Cache decision model
        uses: actions/cache@v4
        with:
          path: |
            assets/xr/models/s1-17m-int8.onnx
            assets/xr/models/s1-17m-tokenizer.json
            assets/xr/models/s1-17m-tokenizer_config.json
          key: s1-17m-int8-cd7f55ced9e661a86ef05004c4afbb57770059f320fccc3028029a87a99310d1
      - name: Fetch models
        run: scripts/xr/fetch-model.sh

      # run.sh's lint is `cargo ndk ... clippy -p fosfora-xr --all-targets -- -D warnings`,
      # the same check a developer runs before pushing.
      - name: Clippy (fosfora-xr, aarch64-linux-android)
        run: scripts/xr/run.sh lint

      - name: Debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.XR_DEBUG_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.XR_DEBUG_KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "::error title=Missing debug keystore secret::Set XR_DEBUG_KEYSTORE_B64 and XR_DEBUG_KEYSTORE_PASS (repo Settings > Secrets and variables > Actions)."
            cat <<'EOF'
          The APK is signed with one stable debug key so builds install over each
          other. Create it once (or reuse ~/.android/debug.keystore, password "android"):

            keytool -genkeypair -v -storetype PKCS12 -keystore fosfora-xr-debug.p12 \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Fosfora XR Debug" -storepass PASSWORD -keypass PASSWORD

          then add it as repository secrets:

            base64 -w0 fosfora-xr-debug.p12 | gh secret set XR_DEBUG_KEYSTORE_B64
            gh secret set XR_DEBUG_KEYSTORE_PASS
          EOF
            exit 1
          fi
          keystore="$RUNNER_TEMP/xr-debug.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          echo "XR_DEBUG_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      # run.sh's build: cargo ndk (release profile) into jniLibs, then
      # `./gradlew assembleDebug`. Install and launch need a device, so they stay local.
      - name: Build APK
        env:
          XR_DEBUG_KEYSTORE_PASS: ${{ secrets.XR_DEBUG_KEYSTORE_PASS }}
        run: scripts/xr/run.sh build

      - name: Verify signature, encrypt and stage artifact
        id: stage
        env:
          # A PR's github.sha is the test merge commit; name the APK after the head.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RECIPIENT: ${{ vars.XR_APK_AGE_RECIPIENT }}
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          echo "apksigner: $apksigner"
          # The cert digest must be identical run to run; that is what lets
          # `adb install -r` replace the previous build. Print apksigner's whole
          # output on failure: its errors go to stdout, next to the cert lines.
          if ! certs=$("$apksigner" verify --print-certs "$apk" 2>&1); then
            printf '%s\n' "$certs"
            echo "::error::apksigner could not verify $apk"
            exit 1
          fi
          printf '%s\n' "$certs" | grep -E 'certificate (DN|SHA-256)' || printf '%s\n' "$certs"
          if ! command -v age > /dev/null; then
            sudo apt-get install -y -o Acquire::Retries=3 age > /dev/null \
              || { sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 age; }
          fi
          name="fosfora-xr-debug-${SHA::7}.apk.age"
          mkdir -p staging
          # The plaintext APK never enters staging/, the only uploaded path.
          age -r "$RECIPIENT" -o "staging/$name" "$apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: staging/${{ steps.stage.outputs.name }}
          retention-days: 14
          if-no-files-found: error
