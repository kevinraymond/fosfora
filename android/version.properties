# The XR app's version, one place for debug and release builds
# (android/app/build.gradle.kts reads it; docs/xr/RELEASE.md).
#
# versionCode: every upload to a Meta release channel needs a strictly higher
# versionCode than any build uploaded before, on any channel. Bump it before
# each upload; never reuse or lower it.
# versionName: what people see in the store and the headset's app info.
#
# XR_VERSION_CODE / XR_VERSION_NAME in the environment override both (CI may
# stamp them).
versionCode=2
versionName=0.1.0
