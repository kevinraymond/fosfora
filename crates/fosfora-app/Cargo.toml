[package]
name = "fosfora-app"
version = "2.3.0"
edition = "2024"
# The pinned toolchain in rust-toolchain.toml, the only compiler anything checks.
# `publish = false`, so no downstream resolver reads this; bump the two together.
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "Real-time audio-reactive particle and shader engine for live performance"
repository = "https://github.com/kevinraymond/fosfora"
readme = "../../README.md"
publish = false

# The engine is a library so a non-desktop frontend (the XR app) can depend on it;
# the `fosfora` binary is the desktop shell over it.
[lib]
name = "fosfora_app"
path = "src/lib.rs"

[[bin]]
name = "fosfora"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
# GPU
wgpu = "27"
# WGSL front-end validation before pipeline creation (trama I5) — keep the major
# in lockstep with wgpu's transitive naga so the lock stays single-version
naga = { version = "27", features = ["wgsl-in"] }
# Windowing (desktop feature)
winit = { version = "0.30", optional = true }
# UI. egui + egui-wgpu stay unconditional: the XR build renders an egui panel to a
# texture. The winit/editor-widget side is desktop-only.
egui = "0.33"
egui-wgpu = "0.33"
egui-winit = { version = "0.33", optional = true }
# trama node-graph canvas — 0.9.x is the egui-0.33 line (0.10+ track egui 0.34/0.35)
egui-snarl = { version = "0.9", optional = true }
# Audio
cpal = "0.17.3"
# FFT
rustfft = "6"
# File watching
notify = { version = "8", optional = true }
notify-debouncer-mini = { version = "0.6", optional = true }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Logging
log = "0.4"
env_logger = "0.11"
# Error handling
anyhow = "1"
thiserror = "2"
# Lock-free channels
crossbeam-channel = "0.5"
# GPU uniform packing
bytemuck = { version = "1", features = ["derive"] }
# Block on async (wgpu init)
pollster = "0.4"
# System theme detection
dark-light = { version = "2", optional = true }
# MIDI input
midir = { version = "0.11", optional = true }
# OSC input/output
rosc = "0.11"
# Ableton Link session sync. Vendors Link (GPL-2.0-or-later) — see the `link`
# feature comment and the deny.toml exception before adding it anywhere.
rusty_link = { version = "0.4.9", optional = true }
# Clean shutdown for the headless --signal loop (no SIGINT handling exists elsewhere)
ctrlc = { version = "3", optional = true }
# XDG config paths
dirs = "6"
# WebSocket server
tungstenite = { version = "0.28", optional = true }
# The web remote's access key (already in the tree via tungstenite)
getrandom = { version = "0.3", optional = true }
# QR code of the web remote's network link (MIT, no dependencies)
qrcodegen = { version = "1.8", optional = true }
# Image loading (particle sprites, media layers)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# WebP animation decoding (image crate only decodes first frame)
image-webp = "0.2"
# GIF decoding (animated GIF frame extraction)
gif = "0.13"
# Native file dialogs
rfd = { version = "0.15", optional = true }
# Linear algebra (camera, projection)
glam = "0.29"
# glTF/GLB import (3D-model obstacle source #1851) — pure Rust, no system deps
gltf = "1"
# Code editor widget (shader editor)
egui_code_editor = { version = "0.2", optional = true }
# Dynamic library loading (NDI runtime, PulseAudio runtime on Linux)
libloading = "0.8"
# Webcam capture
nokhwa = { version = "0.10", features = ["input-native"], optional = true }
# ONNX Runtime for depth estimation (MiDaS) — load-dynamic: runtime dylib loading, no build-time linking
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = ["load-dynamic"] }
# HTTP client for downloads (depth model + runtime, splat demo scene #1800).
# On in every desktop build (the `desktop` feature, which is default): a feature-gated
# one-click demo for the flagship Splat effect would silently vanish in default builds —
# worse than the ~100s-KB size cost. Off for non-desktop (XR) lib builds only because
# nothing there downloads yet; ureq's default rustls + ring TLS builds on Android.
ureq = { version = "3", optional = true }
# Every download is checked against a pinned SHA-256 before it is used.
sha2 = { version = "0.10", optional = true }
# Archive extraction for ONNX Runtime download (tgz on Linux/macOS, zip on Windows)
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
rustc-hash = "2.1.1"
fontdue = "0.9"
wgpu-profiler = { version = "0.25", optional = true }
# Offline song analysis (#2027): pure-Rust decode of a song file so `--analyze` can drive the
# production per-hop chain faster than realtime. Feature-gated — the live app never decodes a
# file, and this is a dev-side tool, so default/release builds carry none of it.
symphonia = { version = "0.6", default-features = false, features = [
    "mp3",
    "flac",
    "wav",
    "pcm",
    "vorbis",
    "ogg",
    "isomp4",
    "aac",
], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# v4l2 loopback output (GH #6). MIT; already in the graph transitively via nokhwa.
v4l = { version = "0.14", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Spout output (GH #5). BSD-2-Clause; vendors the Spout2 SDK + C shim, MSVC x64
# only. Pinned exact: young crate, tiny API surface we depend on.
spout2-rs = { version = "=0.1.1", default-features = false, features = [
    "dx",
], optional = true }
windows = { version = "0.61", features = [
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    # SystemParametersInfoW / SPI_GETCLIENTAREAANIMATION (reduced-motion detection)
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# NSWorkspace.accessibilityDisplayShouldReduceMotion (reduced-motion detection).
# The accessor lives in the NSAccessibility module gated on its own feature.
# NSResponder/NSView/NSWindow: the output window's level (output_window.rs).
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSWorkspace",
    "NSAccessibility",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
# Syphon output (GH #4). Syphon.framework itself is dlopen'd at runtime (it
# ships inside the release app bundle), so only Metal/Foundation — system
# frameworks, always present — are linked at build time. Versions chosen to
# unify with the objc2 0.6 tree already in the graph via objc2-app-kit 0.3.
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSString",
    "NSGeometry",
], optional = true }
objc2-metal = { version = "0.3", default-features = false, features = [
    "MTLAllocation",
    "MTLDevice",
    "MTLTexture",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLResource",
    "MTLTypes",
    "MTLPixelFormat",
], optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[features]
default = ["desktop"]
# Everything that needs a desktop OS: windowing, the egui-winit shell and editor
# widgets, native file dialogs, MIDI, the web remote, file watching, HTTP downloads.
# Off, the lib builds for aarch64-linux-android with none of these crates, for the
# XR frontend. Every feature below that touches a desktop path implies it.
desktop = [
    "dep:winit",
    "dep:egui-winit",
    "dep:egui-snarl",
    "dep:egui_code_editor",
    "dep:notify",
    "dep:notify-debouncer-mini",
    "dep:dark-light",
    "dep:midir",
    "dep:ctrlc",
    "dep:tungstenite",
    "dep:getrandom",
    "dep:qrcodegen",
    "dep:rfd",
    "dep:ureq",
    "dep:sha2",
]
# Exactly what the release downloads ship: release.yml builds with this, so
# `cargo build --release --features release` reproduces a download. The
# platform-sharing three are inert off their OS. Deliberately NOT in it:
# `analyze` (dev tooling), `link` (makes the binary GPL), `profiling`.
release = ["desktop", "video", "ndi", "webcam", "depth", "v4l2", "spout", "syphon"]
video = ["desktop"]
ndi = ["desktop"]
# Virtual camera via v4l2loopback (GH #6). Inert off-Linux: the dep is
# target-scoped and all code is #[cfg(target_os = "linux")]-gated, so one
# flat feature string works on every CI matrix leg.
v4l2 = ["desktop", "dep:v4l"]
# Spout texture sharing (GH #5). Inert off-Windows: the dep is target-scoped
# (and itself a stub off-Windows) and all code is cfg-gated, so one flat
# feature string works on every CI matrix leg.
spout = ["desktop", "dep:spout2-rs"]
# Syphon texture sharing (GH #4). Inert off-macOS: the deps are target-scoped
# and all code is cfg-gated, so one flat feature string works on every CI
# matrix leg.
syphon = ["desktop", "dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]
webcam = ["desktop", "nokhwa"]
depth = ["desktop", "webcam", "ort", "flate2", "tar", "zip"]
# Ableton Link tempo/phase sync (workstream B). rusty_link vendors Ableton
# Link, which is GPL-2.0-or-later (proprietary licensing available from
# Ableton) — a binary built with this feature is distributed under GPL terms.
# Deliberately absent from default and from the `release` feature so shipped
# binaries stay MIT/Apache; building with it yourself is fine.
link = ["desktop", "dep:rusty_link"]
# Song-file decoding on its own (no desktop crates): the XR build decodes its
# bundled test track with it (S6).
decode = ["symphonia"]
# `--analyze <file>`: offline song analysis, no GPU and no window (#2027).
analyze = ["desktop", "decode"]
profiling = ["desktop", "wgpu-profiler"]
wgpu-profiler = ["dep:wgpu-profiler"]
