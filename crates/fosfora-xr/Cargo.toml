[package]
name = "fosfora-xr"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Fosfora VR: OpenXR / Android glue for Quest 3 and Meta VR Glasses"

# `cdylib` is what NativeActivity loads (`libfosfora_xr.so`). `rlib` keeps the
# crate a normal workspace member for `cargo test` / clippy on the desktop, where
# every module is compiled out (see lib.rs).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
log = "0.4"
anyhow = "1"
serde_json = "1"
# The voice path's agent (`agent.rs`, board #3751): `voice.json` and the
# model's reply read into derived structs, and the one HTTPS call to the
# provider the wearer picks. Both already in the lock through the core
# (serde MIT OR Apache-2.0; ureq MIT OR Apache-2.0 with its default rustls +
# ring TLS and the bundled webpki roots, so no system certificate store is
# needed on Android). On every target: the request builders and the reply
# parsers are desktop-tested; the call is a thin wrapper.
serde = { version = "1", features = ["derive"] }
ureq = "3"
# Matches core; `math.rs` builds and tests on every target.
glam = "0.29"

# All real dependencies are Android-only so the desktop workspace build (CI, I1)
# never links OpenXR or the Android glue.
[target.'cfg(target_os = "android")'.dependencies]
# `loaded` dlopens `libopenxr_loader.so`; the Khronos loader AAR that the Gradle
# project depends on puts it in the APK (see android/app/build.gradle.kts).
openxr = { version = "0.22", default-features = false, features = ["loaded"] }
# Same major as wgpu-hal 27 (Cargo.lock: ash 0.38) so S2's raw handles line up.
ash = { version = "0.38", default-features = false, features = ["loaded", "std", "debug"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
# The core, without desktop crates (seam from S3).
fosfora-app = { path = "../fosfora-app", default-features = false, features = ["decode"] }
# Same wgpu as fosfora-app (27), Vulkan backend only; `wgpu::hal` is the
# interop surface. glam matches core.
wgpu = { version = "27", default-features = false, features = ["std", "vulkan", "wgsl", "parking_lot"] }
bytemuck = { version = "1", features = ["derive"] }
# The debug panel (hud.rs): the same egui the core already builds for XR.
egui = "0.33"
egui-wgpu = "0.33"
# Same cpal as core; its AAudio host does capture (core) and playback (S6).
cpal = "0.17.3"
# Raw AAudio for the microphone path: cpal cannot set the input preset, and
# the Quest processes the default (voice recognition) preset for speech.
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-28"] }
# CLOCK_MONOTONIC for the playback tap's latency estimate (already in the
# tree through ndk; MIT OR Apache-2.0).
libc = "0.2"
# JNI for the runtime permissions (`permissions.rs`, board #3264): the
# `Activity` calls with no Java source. The same 0.21 android-activity
# already pulls in (MIT OR Apache-2.0), so nothing new in the lock.
jni = "0.21"
# On-device speech to text for the voice path (`voice.rs`, board #3751):
# whisper.cpp (MIT) through whisper-rs (Unlicense, a public-domain
# dedication; deny.toml allows it for these two crates). Android only, so
# the desktop workspace never builds whisper.cpp. The cross build needs the
# NDK cmake toolchain wrapper and the GGML_* flags `scripts/xr/run.sh` sets,
# and links the NDK's `libc++_shared.so`, which run.sh packages.
whisper-rs = "0.16"
# The voice path's on-device provider (`local.rs`, board #3751, V5): ONNX
# Runtime through `ort` (MIT OR Apache-2.0) with `load-dynamic`, so nothing
# links or downloads the runtime at build time; `libonnxruntime.so` comes
# from the official onnxruntime-android AAR (MIT) that the Gradle project
# depends on, and is dlopened by name at launch. rc.11, not the rc.13 the
# device bench ran: the core pins `=2.0.0-rc.11` for its depth feature, and
# one lock holds one `ort` (prerelease versions of one major unify, and
# `ort-sys` declares `links`); rc.11 asks for the ONNX Runtime 1.23 API,
# which 1.28 serves.
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "load-dynamic"] }
# The decision model's tokenizer (Apache-2.0): ModernBERT's byte-level BPE,
# whose pre-tokenizer pattern needs look-ahead, so the pure-Rust
# `fancy-regex` backend instead of the default `onig` (C, and a cross build).
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

# Host tests validate the XR-only WGSL (`ripple.rs`) at baseline WebGPU
# capabilities; the same naga as wgpu 27 and the core, so the lock keeps one.
[dev-dependencies]
naga = { version = "27", features = ["wgsl-in"] }

# The desktop GPU tests (`tests/depth_collide_gpu.rs`, `#[ignore]`d like the
# core's probes: they need an adapter) drive the XR-only shaders headless.
# The same wgpu, pollster and bytemuck as the core, so nothing new in the lock;
# desktop only, so the Android lint keeps its Vulkan-only wgpu.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
wgpu = "27"
pollster = "0.4"
bytemuck = "1"
# The core, for the desktop tests of the ported surface effects
# (`surface_port.rs`): its loader, parameter packing and uniform, as the
# Android build links them. A dev-dependency, so the desktop library still
# compiles to the plain-number modules alone; no features, so a workspace
# test or clippy run builds the core exactly as it did without this line.
fosfora-app = { path = "../fosfora-app", default-features = false }
# `local.rs`'s desktop tests (board #3751, V5): the tokenizer for the
# rendering's parity with the training toolkit, and `ort` for the
# `#[ignore]`d run of the real model against its parity fixtures (with
# `ORT_DYLIB_PATH` naming a host ONNX Runtime). Dev-dependencies only, so the
# desktop library builds neither; `load-dynamic` downloads and builds no
# runtime.
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "load-dynamic"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

[lints]
workspace = true
