# Fosfora Bridge Scripts — Docker Compose
#
# Usage:
#   docker compose up                    # start all enabled bridges
#   docker compose up hands lfo          # start specific bridges
#   docker compose --profile depth up    # include depth camera bridges
#   docker compose --profile gpu up      # use GPU-accelerated variants

services:

  # ── Always-available (no hardware) ──────────────────────────────

  lfo:
    image: fosfora/bridge-smart-lfo
    build:
      context: ..
      dockerfile: bridges/docker/Dockerfile.smart-lfo
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      FOSFORA_HOST: ${FOSFORA_HOST:-host.docker.internal}
      FOSFORA_PORT: ${FOSFORA_PORT:-9002}
    restart: unless-stopped

  gamepad:
    image: fosfora/bridge-gamepad
    build:
      context: ..
      dockerfile: bridges/docker/Dockerfile.gamepad
    extra_hosts: ["host.docker.internal:host-gateway"]
    privileged: true    # Needs access to /dev/input
    volumes:
      - /dev/input:/dev/input:ro
    environment:
      FOSFORA_HOST: ${FOSFORA_HOST:-host.docker.internal}
      FOSFORA_PORT: ${FOSFORA_PORT:-9002}
    restart: unless-stopped

  # ── Webcam bridges ──────────────────────────────────────────────

  hands:
    image: fosfora/bridge-vision
    build:
      context: ..
      dockerfile: bridges/docker/Dockerfile.vision
    command: hands
    extra_hosts: ["host.docker.internal:host-gateway"]
    devices:
      - "${VIDEO_DEVICE:-/dev/video0}:/dev/video0"
    environment:
      FOSFORA_HOST: ${FOSFORA_HOST:-host.docker.internal}
      FOSFORA_PORT: ${FOSFORA_PORT:-9002}
      FOSFORA_FPS: ${FOSFORA_FPS:-30}
    restart: unless-stopped

  pose:
    image: fosfora/bridge-vision
    command: pose
    extra_hosts: ["host.docker.internal:host-gateway"]
    devices:
      - "${VIDEO_DEVICE:-/dev/video0}:/dev/video0"
    environment:
      FOSFORA_HOST: ${FOSFORA_HOST:-host.docker.internal}
      FOSFORA_PORT: ${FOSFORA_PORT:-9002}
      FOSFORA_FPS: ${FOSFORA_FPS:-30}
    restart: unless-stopped

  face:
    image: fosfora/bridge-vision
    command: face
    extra_hosts: ["host.docker.internal:host-gateway"]
    devices:
      - "${VIDEO_DEVICE:-/dev/video0}:/dev/video0"
    environment:
      FOSFORA_HOST: ${FOSFORA_HOST:-host.docker.internal}
      FOSFORA_PORT: ${FOSFORA_PORT:-9002}
      FOSFORA_FPS: ${FOSFORA_FPS:-30}
    restart: unless-stopped

  yolo:
    image: fosfora/bridge-vision
    command: yolo
    extra_hosts: ["host.docker.internal:host-gateway"]
    devices:
      - "${VIDEO_DEVICE:-/dev/video0}:/dev/video0"
    environment:
      FOSFORA_HOST: ${FOSFORA_HOST:-host.docker.internal}
      FOSFORA_PORT: ${FOSFORA_PORT:-9002}
      FOSFORA_FPS: ${FOSFORA_FPS:-15}
    restart: unless-stopped

  # ── Depth cameras (opt-in via --profile depth) ──────────────────

  realsense:
    image: fosfora/bridge-realsense
    build:
      context: ..
      dockerfile: bridges/docker/Dockerfile.realsense
    profiles: ["depth"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    privileged: true    # RealSense needs broad USB access
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      FOSFORA_HOST: ${FOSFORA_HOST:-host.docker.internal}
      FOSFORA_PORT: ${FOSFORA_PORT:-9002}
    restart: unless-stopped

  # ── GPU-accelerated variants (opt-in via --profile gpu) ─────────

  yolo-gpu:
    image: fosfora/bridge-vision:gpu
    build:
      context: ..
      dockerfile: bridges/docker/Dockerfile.vision-gpu
    profiles: ["gpu"]
    command: yolo --fps 30
    extra_hosts: ["host.docker.internal:host-gateway"]
    devices:
      - "${VIDEO_DEVICE:-/dev/video0}:/dev/video0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      FOSFORA_HOST: ${FOSFORA_HOST:-host.docker.internal}
      FOSFORA_PORT: ${FOSFORA_PORT:-9002}
    restart: unless-stopped
